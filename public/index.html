<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Finance Manager</h1>

    <p id="status" class="status" hidden></p>

    <div id="app" hidden>
      <section class="balance-card">
        <p class="label">Current Balance</p>
        <p id="balance" class="balance">₹0.00</p>
        <div class="totals">
          <div><span class="label">Income</span><span id="total-income" class="income">₹0.00</span></div>
          <div><span class="label">Expenses</span><span id="total-expense" class="expense">₹0.00</span></div>
        </div>
      </section>

      <section class="card wizard" id="wizard">
        <div class="wizard-header">
          <button type="button" id="wizard-back" class="back-btn" aria-label="Back" hidden>←</button>
          <h2 id="wizard-title">Add Entry</h2>
          <div class="steps" aria-hidden="true">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>

        <!-- Step 1: income or expense -->
        <div class="step" data-step="1">
          <p class="step-hint">What would you like to add?</p>
          <div class="type-cards">
            <button type="button" class="type-card income" data-type="income">
              <span class="type-icon" aria-hidden="true">↓</span>
              <span class="type-name">Income</span>
              <span class="type-sub">Money in</span>
            </button>
            <button type="button" class="type-card expense" data-type="expense">
              <span class="type-icon" aria-hidden="true">↑</span>
              <span class="type-name">Expense</span>
              <span class="type-sub">Money out</span>
            </button>
          </div>
        </div>

        <!-- Step 2: category -->
        <div class="step" data-step="2" hidden>
          <p class="step-hint" id="category-hint">Choose a type</p>
          <div class="category-grid" id="category-grid"></div>
        </div>

        <!-- Step 3: amount -->
        <form class="step" data-step="3" id="amount-form" hidden>
          <button type="button" class="chosen" id="chosen" aria-label="Change category">
            <span class="chosen-icon" id="chosen-icon" aria-hidden="true"></span>
            <span class="chosen-text">
              <span class="chosen-type" id="chosen-type"></span>
              <span class="chosen-category" id="chosen-category"></span>
            </span>
            <span class="chosen-change">Change</span>
          </button>
          <label class="amount-field">
            <span class="currency" aria-hidden="true">₹</span>
            <input id="amount" type="number" inputmode="decimal" placeholder="0" min="0.01" step="0.01" required aria-label="Amount">
          </label>
          <input id="note" type="text" placeholder="Note (optional)" maxlength="100">
          <input id="date" type="date" required aria-label="Date">
          <button type="submit" id="post-btn" class="post-btn">Post Entry</button>
        </form>

        <p id="posted" class="posted" hidden>✓ Entry posted</p>
      </section>

      <section>
        <h2 class="section-title">Entries <span class="hint">Tap a card to edit</span></h2>
        <p id="empty" class="empty">No entries yet.</p>
        <ul id="entries" class="entry-cards"></ul>
      </section>
    </div>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form" method="dialog">
      <div class="sheet-header">
        <h2 id="edit-title">Edit Entry</h2>
        <button type="button" id="edit-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="type-toggle" role="radiogroup" aria-label="Entry type">
        <label class="toggle income"><input type="radio" name="type" value="income"> Income</label>
        <label class="toggle expense"><input type="radio" name="type" value="expense"> Expense</label>
      </div>
      <div class="category-grid compact" id="edit-categories" role="radiogroup" aria-label="Category"></div>
      <label class="amount-field small">
        <span class="currency" aria-hidden="true">₹</span>
        <input id="edit-amount" type="number" inputmode="decimal" placeholder="0" min="0.01" step="0.01" required aria-label="Amount">
      </label>
      <input id="edit-note" type="text" placeholder="Note (optional)" maxlength="100">
      <input id="edit-date" type="date" required aria-label="Date">
      <button type="submit" id="edit-save">Save Changes</button>
      <button type="button" id="edit-delete" class="danger">Delete Entry</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
